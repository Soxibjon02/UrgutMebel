<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c26d2e"/>
      <stop offset="50%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#8f4a18"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#grad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Center Glow -->
  <circle cx="256" cy="240" r="140" fill="url(#grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Furniture Armchair / Crown Logo -->
  <g transform="translate(106, 100)" fill="none" stroke="url(#grad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Backrest -->
    <path d="M 50 150 C 50 60, 250 60, 250 150 L 250 200 L 50 200 Z" fill="url(#grad)" fill-opacity="0.2"/>
    <!-- Left Arm -->
    <path d="M 30 140 C 15 140, 15 220, 45 220 L 60 220 L 60 140 Z" fill="url(#grad)" fill-opacity="0.3"/>
    <!-- Right Arm -->
    <path d="M 270 140 C 285 140, 285 220, 255 220 L 240 220 L 240 140 Z" fill="url(#grad)" fill-opacity="0.3"/>
    <!-- Cushion -->
    <rect x="50" y="195" width="200" height="45" rx="12" fill="url(#grad)" fill-opacity="0.4"/>
    <!-- Legs -->
    <line x1="65" y1="240" x2="45" y2="285" stroke-width="18"/>
    <line x1="235" y1="240" x2="255" y2="285" stroke-width="18"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 390 110 Q 390 140 420 140 Q 390 140 390 170 Q 390 140 360 140 Q 390 140 390 110 Z" fill="#d4a359"/>
  <path d="M 120 120 Q 120 135 135 135 Q 120 135 120 150 Q 120 135 105 135 Q 120 135 120 120 Z" fill="#c26d2e"/>
  
  <!-- Urgut Label -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#f5f3ef" text-anchor="middle" letter-spacing="4">URGUT MEBEL</text>
</svg>
